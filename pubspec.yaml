name: flutter_alinfo9
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Networking
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  
  # Local Storage (using hive_ce instead of hive)
  hive_ce: ^2.6.0
  hive_ce_flutter: ^2.1.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.5
  
  # Media & Files
  image_picker: ^1.2.1
  file_picker: ^8.1.6
  
  # WebSocket
  web_socket_channel: ^3.0.3
  
  # Utilities
  intl: ^0.19.0
  shimmer: ^3.0.0
  timeago: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  
  # Code Generation for Hive
  hive_ce_generator: ^1.6.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

